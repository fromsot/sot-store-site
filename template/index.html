<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>##STORE_NAME##</title>
<meta name="description" content="##STORE_DESCRIPTION##">
<link rel="stylesheet" href="style.css">
##THEME_STYLE##
</head>
<body>

<header class="hero">
  ##HERO_IMAGE##
  <div class="hero-text">
    <h1>##STORE_NAME##</h1>
    <p class="catchcopy">##CATCHCOPY##</p>
  </div>
</header>

<main>

  <section class="section links">
    <div class="button-group">
      ##LINK_BUTTONS##
    </div>
  </section>

  <section class="section about">
    <h2>お店について</h2>
    <p>##STORE_DESCRIPTION##</p>
  </section>

  <section class="section hours">
    <h2>営業時間</h2>
    <table class="hours-table">
      ##HOURS_ROWS##
    </table>
    <p class="closed">定休日：##CLOSED##</p>
  </section>

  <section class="section access">
    <h2>アクセス</h2>
    <p class="address">##ADDRESS##</p>
    <p><a class="text-link" href="##GOOGLE_MAP_URL##" target="_blank" rel="noopener">Googleマップで見る</a></p>
    <p>電話番号：<a class="text-link" href="tel:##PHONE_TEL##">##PHONE##</a></p>
  </section>

  <section class="section gallery">
    <h2>写真</h2>
    <div class="gallery-grid">
      ##GALLERY_ITEMS##
    </div>
  </section>

</main>

<footer>
  <p class="footer-name">##STORE_NAME##</p>
  <p class="footer-detail">##ADDRESS##　／　##PHONE##</p>
  <p class="powered">Powered by SOT｜店舗Webサポート</p>
</footer>

</body>
</html>
